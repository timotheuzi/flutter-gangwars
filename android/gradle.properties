org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.warning.mode=all
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP 9.1 reports the two Flutter flags above as deprecated, but they cannot be
# removed: Flutter 3.47.x re-injects them automatically (see the Flutter tool's
# disable_new_dsl_migration.dart / disable_built_in_kotlin_migration.dart) and its
# Gradle plugin still compiles against the legacy variant API (ApkVariant,
# applicationVariants) that only exists while android.newDsl=false.
# Silence AGP's deprecation notice for these Flutter-managed options.
android.suppressUnsupportedOptionWarnings=android.newDsl,android.builtInKotlin,android.suppressUnsupportedOptionWarnings
# KGP 2.4 warns that applying 'org.jetbrains.kotlin.android' is deprecated since AGP 9,
# but Flutter 3.47.x still applies that plugin itself (see android.builtInKotlin above),
# so the notice is unavoidable for Flutter projects on AGP 9.
kotlin.suppressGradlePluginWarnings=kotlin:kgp:deprecation:deprecated-kotlin-android-plugin
