name: Build & Release iOS (signed + unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method (app-store, ad-hoc, development, enterprise)'
        required: false
        default: 'app-store'

permissions:
  contents: write

jobs:
  build-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          architecture: 'x64'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document || true
          cd ios
          pod install --repo-update || true

      - name: Build unsigned .ipa
        run: |
          flutter build ipa --no-codesign

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/ipa/*.ipa

  build-signed:
    if: ${{ secrets.APPLE_CERTIFICATE_P12 && secrets.MOBILEPROVISION && secrets.APPLE_CERTIFICATE_PASSWORD && secrets.APPLE_TEAM_ID }}
    runs-on: macos-latest
    env:
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          architecture: 'x64'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies & CocoaPods
        run: |
          flutter pub get
          sudo gem install cocoapods --no-document || true
          cd ios
          pod install --repo-update || true
          cd ..

      - name: Decode signing assets
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_P12 }}" | base64 --decode > cert.p12
          echo "${{ secrets.MOBILEPROVISION }}" | base64 --decode > profile.mobileprovision

      - name: Create temporary keychain and import certificate
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          echo $KEYCHAIN_PASS > /tmp/keychain_pass
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k ~/Library/Keychains/build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign || exit 1
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" ~/Library/Keychains/build.keychain
        shell: bash

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles
        shell: bash

      - name: Optionally set CODE_SIGN_IDENTITY
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "CODE_SIGN_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
          else
            IDENTITY=$(security find-identity -v -p codesigning | awk -F\" '{print $2; exit}')
            echo "CODE_SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build signed .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ env.CODE_SIGN_IDENTITY }}
          EXPORT_METHOD: ${{ env.EXPORT_METHOD }}
        run: |
          flutter build ipa --export-method "$EXPORT_METHOD"
        shell: bash

      - name: Upload signed .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: build/ios/ipa/*.ipa

  create_release:
    needs: [build-unsigned, build-signed]
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: determine_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_ID}" >> $GITHUB_ENV
          fi

      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: artifacts/unsigned

      - name: Download signed artifact (if present)
        uses: actions/download-artifact@v4
        with:
          name: ios-signed-ipa
          path: artifacts/signed
        continue-on-error: true

      - name: Locate unsigned .ipa
        id: find_unsigned
        run: |
          if ls artifacts/unsigned/*.ipa 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(ls artifacts/unsigned/*.ipa | head -n1)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Locate signed .ipa
        id: find_signed
        run: |
          if ls artifacts/signed/*.ipa 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(ls artifacts/signed/*.ipa | head -n1)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false

      - name: Prepare unsigned asset info
        if: ${{ steps.find_unsigned.outputs.found == 'true' }}
        id: prep_unsigned
        run: |
          path="${{ steps.find_unsigned.outputs.path }}"
          name=$(basename "$path")
          echo "asset_path=$path" >> $GITHUB_OUTPUT
          echo "asset_name=$name" >> $GITHUB_OUTPUT

      - name: Upload unsigned IPA to release
        if: ${{ steps.find_unsigned.outputs.found == 'true' }}
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.prep_unsigned.outputs.asset_path }}
          asset_name: ${{ steps.prep_unsigned.outputs.asset_name }}
          asset_content_type: application/octet-stream

      - name: Prepare signed asset info
        if: ${{ steps.find_signed.outputs.found == 'true' }}
        id: prep_signed
        run: |
          path="${{ steps.find_signed.outputs.path }}"
          name=$(basename "$path")
          echo "asset_path=$path" >> $GITHUB_OUTPUT
          echo "asset_name=$name" >> $GITHUB_OUTPUT

      - name: Upload signed IPA to release
        if: ${{ steps.find_signed.outputs.found == 'true' }}
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.prep_signed.outputs.asset_path }}
          asset_name: ${{ steps.prep_signed.outputs.asset_name }}
          asset_content_type: application/octet-stream
