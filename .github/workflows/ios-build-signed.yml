name: Build iOS (signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method (app-store, ad-hoc, development, enterprise)'
        required: false
        default: 'app-store'

jobs:
  build:
    runs-on: macos-latest
    env:
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies & CocoaPods
        run: |
          flutter pub get
          sudo gem install cocoapods --no-document || true
          cd ios
          pod install --repo-update || true
          cd ..

      - name: Decode signing assets
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_P12 }}" | base64 --decode > cert.p12
          echo "${{ secrets.MOBILEPROVISION }}" | base64 --decode > profile.mobileprovision

      - name: Create temporary keychain and import certificate
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          echo $KEYCHAIN_PASS > /tmp/keychain_pass
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k ~/Library/Keychains/build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign || exit 1
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" ~/Library/Keychains/build.keychain
        shell: bash

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles
        shell: bash

      - name: Optionally set CODE_SIGN_IDENTITY
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "Selected identity from secrets"
            echo "CODE_SIGN_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
          else
            IDENTITY=$(security find-identity -v -p codesigning | awk -F\" '{print $2; exit}')
            echo "AUTO_DETECTED_IDENTITY=$IDENTITY" >> $GITHUB_ENV
            echo "CODE_SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build signed .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ env.CODE_SIGN_IDENTITY }}
          EXPORT_METHOD: ${{ env.EXPORT_METHOD }}
        run: |
          flutter build ipa --export-method "$EXPORT_METHOD"
        shell: bash

      - name: Upload signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: build/ios/ipa/*.ipa

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PASS=$(cat /tmp/keychain_pass || true)
          security delete-keychain build.keychain || true
          rm -f cert.p12 profile.mobileprovision /tmp/keychain_pass || true
        shell: bash
