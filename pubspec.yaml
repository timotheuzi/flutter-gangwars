name: droid_gangwar_flutter
description: A cross-platform Flutter adaptation of the classic Gangwar game
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  flame: ^1.12.0
  flame_tiled: ^3.0.9
  audioplayers: ^6.5.1
  flutter_svg: ^2.0.9
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
